<section class="skills-section">
  <div class="section-header">
    <span class="section-tag">Skills</span>
    <h2 class="section-title">My <span class="highlight">Tech Stack</span></h2>
    <div class="section-divider"></div>
  </div>
  <div class="skills-filter">
    <button *ngFor="let cat of categories" (click)="setCategory(cat.key)" [class.active]="activeCategory === cat.key">{{ cat.label }}</button>
  </div>
  <div class="skills-grid">
    <div class="skill-card" *ngFor="let skill of filteredSkills">
      <span class="skill-dot"></span><span class="skill-name">{{ skill.name }}</span>
    </div>
  </div>
</section>
