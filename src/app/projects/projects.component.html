<section class="projects-section">
  <div class="section-header">
    <span class="section-tag">Projects</span>
    <h2 class="section-title">Data Engineering <span class="highlight">In Action</span></h2>
    <div class="section-divider"></div>
  </div>
  <div class="projects-grid">
    <div class="project-card" *ngFor="let project of projects">
      <div class="card-header">
        <div class="card-icon"><i class="fas" [ngClass]="project.icon"></i></div>
        <div><h3 class="card-title">{{ project.title }}</h3><p class="card-subtitle">{{ project.subtitle }}</p></div>
      </div>
      <span class="card-period">{{ project.period }}</span>
      <p class="card-description">{{ project.description }}</p>
      <div class="card-metrics">
        <div class="metric" *ngFor="let m of project.metrics">
          <span class="metric-value">{{ m.value }}</span>
          <span class="metric-label">{{ m.label }}</span>
        </div>
      </div>
      <ul class="card-highlights"><li *ngFor="let h of project.highlights">{{ h }}</li></ul>
      <div class="card-tech"><span class="tech-tag" *ngFor="let t of project.tech">{{ t }}</span></div>
    </div>
  </div>
</section>
